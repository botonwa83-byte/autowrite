name: ApexPromoter
options:
  bundleIdPrefix: com.kingtop
  deploymentTarget:
    iOS: "17.0"
schemes:
  ApexPromoter:
    build:
      targets:
        ApexPromoter: all
    run:
      storeKitConfiguration: ApexPromoter/ApexPromoter.storekit
    test:
      storeKitConfiguration: ApexPromoter/ApexPromoter.storekit
      targets:
        - ApexPromoterTests
        - ApexPromoterUITests
targets:
  ApexPromoter:
    type: application
    platform: iOS
    sources: [ApexPromoter]
    resources: [ApexPromoter/Resources, ApexPromoter/ApexPromoter.storekit, ApexPromoter/PrivacyInfo.xcprivacy]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.kingtop.apexpromoter
      DEVELOPMENT_TEAM: Z7F8BY55DS
      SWIFT_VERSION: 5.9
      MARKETING_VERSION: 1.0.0
      CURRENT_PROJECT_VERSION: 4
      INFOPLIST_FILE: ApexPromoter/Info.plist
      INFOPLIST_KEY_CFBundleDisplayName: Apex 宣传台
      INFOPLIST_KEY_CFBundleExecutable: $(EXECUTABLE_NAME)
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
  ApexPromoterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ApexPromoterTests]
    dependencies: [{target: ApexPromoter}]
    settings:
      GENERATE_INFOPLIST_FILE: YES
  ApexPromoterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ApexPromoterUITests]
    dependencies: [{target: ApexPromoter}]
    settings:
      GENERATE_INFOPLIST_FILE: YES
