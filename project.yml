name: ApexPromoter
options:
  bundleIdPrefix: com.kingtop
  deploymentTarget:
    iOS: "17.0"
targets:
  ApexPromoter:
    type: application
    platform: iOS
    sources: [ApexPromoter]
    resources: [ApexPromoter/Resources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.kingtop.apexpromoter
      SWIFT_VERSION: 5.9
      INFOPLIST_KEY_CFBundleDisplayName: Apex 宣传台
      INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
  ApexPromoterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ApexPromoterTests]
    dependencies: [{target: ApexPromoter}]
